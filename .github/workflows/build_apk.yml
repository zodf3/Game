name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Configure Android Project
        run: |
          if [ -d "twenty_nine_card_game" ]; then cd twenty_nine_card_game; fi
          
          # 1. Backup custom AndroidManifest.xml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          
          # 2. Generate standard Gradle wrapper with valid lowercase project name
          flutter create . --platforms=android --project-name twenty_nine_card_game --org com.example
          
          # 3. Restore Bluetooth & Location permissions into AndroidManifest.xml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          # 4. Enforce minSdkVersion 21
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true

      - name: Get Dependencies
        run: |
          if [ -d "twenty_nine_card_game" ]; then cd twenty_nine_card_game; fi
          flutter pub get

      - name: Build Android Release APK
        run: |
          if [ -d "twenty_nine_card_game" ]; then cd twenty_nine_card_game; fi
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwentyNine-Release-APK
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          if-no-files-found: error
